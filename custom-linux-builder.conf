# Sample configuration for custom-linux-builder
# Place this file at one of the following locations to set defaults:
#  - /etc/custom-linux-builder.conf    (system-wide)
#  - $HOME/.custom-linux-builder.conf  (per-user)
#  - ./custom-linux-builder.conf       (project-local)
#
# File format: shell-style KEY=VALUE pairs. Values that contain spaces must be quoted.
# Example values are provided below — uncomment and adapt as needed.

# SOURCE_ISO="/path/to/original.iso"   # Optional: you can still pass the ISO as CLI arg
# OUTPUT_ISO="./my-custom.iso"         # (recommended) set the output filename explicitly
# VOLUME_LABEL="MyDistroCustom"        # ISO volume label
# BUILD_DIR="./build"                  # Working directory
# RUN_SCRIPT="./customize.sh"          # Script to copy and run inside chroot
# CHROOT_AFTER=1                         # 1 to drop into interactive chroot after running RUN_SCRIPT
# KEEP_BUILD=1                           # 1 to keep build dir after completion, 0 to remove it

# Example:
# OUTPUT_ISO="./ubuntu-custom.iso"
# VOLUME_LABEL="UbuntuCustom"
# RUN_SCRIPT="./samples/customize-ubuntu.sh"
# CHROOT_AFTER=1
